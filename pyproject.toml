[project]
name = "market-support-crewai-agent"
version = "0.1.0"
description = "FastAPI external agent brain for market support typed actions"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.14.4",
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
market-support-crewai-agent = "market_support_crewai_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_support_crewai_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
